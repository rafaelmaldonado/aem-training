<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Author is not the public website</title>
  <desc id="desc">A side-by-side comparison shows the same WKND page in the internal Author editor and the clean public Publish experience.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#39dbc1"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#f4f7f6}.eyebrow{font-size:20px;font-weight:800;letter-spacing:3px;fill:#39dbc1}.title{font-size:56px;font-weight:760;letter-spacing:-2px}.subtitle{font-size:23px;fill:#9aa5a2}.section{font-size:30px;font-weight:760}.body{font-size:21px}.small{font-size:17px;fill:#9aa5a2}.tag{font-size:15px;font-weight:800;letter-spacing:1px}.white{fill:#fff}.source{font-size:15px;fill:#71807c}.window{fill:#111817;stroke:#33403d;stroke-width:2}.arrow{fill:none;stroke:#39dbc1;stroke-width:6;marker-end:url(#arrow)}
    rect[fill="#fff"],path[fill="#fff"],circle[fill="#fff"]{fill:#111817}</style>
  </defs>
  <rect width="1600" height="900" fill="#0b0f0e"/><rect width="14" height="900" fill="#39dbc1"/>
  <g opacity=".16" fill="none" stroke="#53615e"><circle cx="1570" cy="920" r="650" stroke-width="180"/><circle cx="1570" cy="920" r="390" stroke-width="110"/></g>
  <text x="72" y="70" class="eyebrow">02 · TWO SERVICES, TWO AUDIENCES</text>
  <text x="72" y="145" class="title">Author is not the public website.</text>
  <text x="72" y="198" class="subtitle">The page may share a path and design, but each service has a different job and audience.</text>

  <rect x="72" y="248" width="662" height="500" rx="20" fill="#101817" stroke="#2fbba5" stroke-width="3"/>
  <rect x="100" y="277" width="606" height="405" rx="14" class="window"/>
  <rect x="100" y="277" width="606" height="44" rx="14" fill="#080b0a"/>
  <circle cx="126" cy="299" r="6" fill="#fb7185"/><circle cx="148" cy="299" r="6" fill="#facc15"/><circle cx="170" cy="299" r="6" fill="#4ade80"/>
  <rect x="122" y="343" width="150" height="316" rx="8" fill="#131a19"/>
  <text x="143" y="379" class="small" font-weight="700">COMPONENTS</text>
  <rect x="142" y="402" width="108" height="42" rx="8" fill="#fff" stroke="#4a5552"/><text x="158" y="429" class="small">Title</text>
  <rect x="142" y="458" width="108" height="42" rx="8" fill="#fff" stroke="#4a5552"/><text x="158" y="485" class="small">Image</text>
  <rect x="142" y="514" width="108" height="42" rx="8" fill="#fff" stroke="#4a5552"/><text x="158" y="541" class="small">Text</text>
  <rect x="298" y="343" width="382" height="316" rx="8" fill="#fff" stroke="#2fbba5" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="320" y="365" width="338" height="106" rx="7" fill="#17302c"/>
  <path d="M320 456l75-60 65 41 55-35 143 69H320Z" fill="#37c8b0"/>
  <text x="320" y="515" class="section" fill="#72ead7">Cycling Yucatán</text>
  <rect x="320" y="538" width="290" height="13" rx="6" fill="#4a5552"/><rect x="320" y="566" width="235" height="13" rx="6" fill="#4a5552"/>
  <rect x="320" y="603" width="128" height="36" rx="18" fill="#2fbba5"/><text x="349" y="628" class="small white" font-weight="700">Edit title</text>
  <rect x="102" y="695" width="166" height="42" rx="21" fill="#2fbba5"/><text x="133" y="723" class="tag white">AUTHOR</text>
  <text x="290" y="723" class="body">Internal · authenticated · editable</text>

  <path d="M754 472H838" class="arrow"/>
  <rect x="743" y="412" width="106" height="38" rx="19" fill="#fff" stroke="#39dbc1" stroke-width="2"/>
  <text x="763" y="437" class="tag" fill="#39dbc1">PUBLISH</text>

  <rect x="868" y="248" width="660" height="500" rx="20" fill="#121c1b" stroke="#32cbb3" stroke-width="3"/>
  <rect x="896" y="277" width="604" height="405" rx="14" class="window"/>
  <rect x="896" y="277" width="604" height="44" rx="14" fill="#0d1715"/>
  <circle cx="922" cy="299" r="6" fill="#fb7185"/><circle cx="944" cy="299" r="6" fill="#facc15"/><circle cx="966" cy="299" r="6" fill="#4ade80"/>
  <text x="1010" y="306" class="small" fill="#162c28">wknd.example/guides/cycling-yucatan</text>
  <rect x="926" y="350" width="544" height="176" rx="10" fill="#162c28"/>
  <path d="M926 500l120-99 104 66 90-56 230 115H926Z" fill="#2fc2ab"/>
  <text x="926" y="576" class="section" fill="#72ead7">Cycling Yucatán</text>
  <rect x="926" y="600" width="420" height="14" rx="7" fill="#43504d"/><rect x="926" y="630" width="340" height="14" rx="7" fill="#43504d"/>
  <rect x="898" y="695" width="166" height="42" rx="21" fill="#32cbb3"/><text x="925" y="723" class="tag white">PUBLISH</text>
  <text x="1088" y="723" class="body">Public · approved · read-only</text>

  <rect x="72" y="778" width="1456" height="66" rx="14" fill="#102522"/>
  <text x="100" y="819" class="body"><tspan font-weight="700" fill="#39dbc1">Diagnostic rule:</tspan> visible in Author but absent publicly? Confirm publication before changing code.</text>
  <text x="72" y="875" class="source">Source: Adobe · AEM as a Cloud Service architecture</text>
</svg>
