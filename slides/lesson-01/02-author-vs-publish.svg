  <rect x="898" y="695" width="166" height="42" rx="21" fill="#74d2f5"/><text x="925" y="723" class="tag white">PUBLISH</text>
  <text x="1088" y="723" class="body">Public · approved · read-only</text>

  <rect x="72" y="778" width="1456" height="66" rx="14" fill="#0a3048"/>
  <text x="100" y="819" class="body"><tspan font-weight="700" fill="#9fe7ff">Diagnostic rule:</tspan> visible in Author but absent publicly? Confirm publication before changing code.</text>
  <text x="72" y="875" class="source">Source: Adobe · AEM as a Cloud Service architecture</text>
</svg>
