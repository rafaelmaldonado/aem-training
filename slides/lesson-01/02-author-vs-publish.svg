  <rect x="868" y="248" width="660" height="500" rx="20" fill="#092a42" stroke="#74d2f5" stroke-width="3"/>
  <rect x="896" y="277" width="604" height="405" rx="14" class="window"/>
  <rect x="896" y="277" width="604" height="44" rx="14" fill="#061928"/>
  <circle cx="922" cy="299" r="6" fill="#fb7185"/><circle cx="944" cy="299" r="6" fill="#facc15"/><circle cx="966" cy="299" r="6" fill="#4ade80"/>
  <text x="1010" y="306" class="small" fill="#123a55">wknd.example/guides/cycling-yucatan</text>
