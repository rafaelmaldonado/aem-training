<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Author is not the public website</title>
  <desc id="desc">A side-by-side comparison shows the same WKND page in the internal Author editor and the clean public Publish experience.</desc>
  <defs>
    <radialGradient id="blue-glow" cx="52%" cy="76%" r="72%"><stop offset="0" stop-color="#e9f9ff" stop-opacity=".9"/><stop offset=".3" stop-color="#7bc9ea" stop-opacity=".34"/><stop offset=".68" stop-color="#174e70" stop-opacity=".12"/><stop offset="1" stop-color="#031d32" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#9fe7ff" opacity=".22"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#9fe7ff"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#f7fbff}.eyebrow{font-size:20px;font-weight:800;letter-spacing:3px;fill:#9fe7ff}.title{font-size:56px;font-weight:760;letter-spacing:-2px}.subtitle{font-size:23px;fill:#b8c8d4}.section{font-size:30px;font-weight:760}.body{font-size:21px}.small{font-size:17px;fill:#b8c8d4}.tag{font-size:15px;font-weight:800;letter-spacing:1px}.white{fill:#fff}.source{font-size:15px;fill:#6f91a5}.window{fill:#08283f;stroke:#2f6f91;stroke-width:2}.arrow{fill:none;stroke:#9fe7ff;stroke-width:6;marker-end:url(#arrow)}
    rect[fill="#fff"],path[fill="#fff"],circle[fill="#fff"]{fill:#08283f}</style>
  </defs>
  <rect width="1600" height="900" fill="#031d32"/><rect width="14" height="900" fill="#9fe7ff"/>
  <rect width="1600" height="900" fill="url(#blue-glow)"/><rect width="1600" height="900" fill="url(#dots)" opacity=".18"/><g opacity=".12" fill="none" stroke="#9fe7ff"><circle cx="1570" cy="920" r="650" stroke-width="180"/><circle cx="1570" cy="920" r="390" stroke-width="110"/></g>
  <text x="72" y="70" class="eyebrow">02 · TWO SERVICES, TWO AUDIENCES</text>
  <text x="72" y="145" class="title">Author is not the public website.</text>
  <text x="72" y="198" class="subtitle">The page may share a path and design, but each service has a different job and audience.</text>

  <rect x="72" y="248" width="662" height="500" rx="20" fill="#08283f" stroke="#6ecbed" stroke-width="3"/>
  <rect x="100" y="277" width="606" height="405" rx="14" class="window"/>
  <rect x="100" y="277" width="606" height="44" rx="14" fill="#020e18"/>
  <circle cx="126" cy="299" r="6" fill="#fb7185"/><circle cx="148" cy="299" r="6" fill="#facc15"/><circle cx="170" cy="299" r="6" fill="#4ade80"/>
  <rect x="122" y="343" width="150" height="316" rx="8" fill="#08253b"/>
  <text x="143" y="379" class="small" font-weight="700">COMPONENTS</text>
  <rect x="142" y="402" width="108" height="42" rx="8" fill="#fff" stroke="#527b90"/><text x="158" y="429" class="small">Title</text>
  <rect x="142" y="458" width="108" height="42" rx="8" fill="#fff" stroke="#527b90"/><text x="158" y="485" class="small">Image</text>
  <rect x="142" y="514" width="108" height="42" rx="8" fill="#fff" stroke="#527b90"/><text x="158" y="541" class="small">Text</text>
  <rect x="298" y="343" width="382" height="316" rx="8" fill="#fff" stroke="#6ecbed" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="320" y="365" width="338" height="106" rx="7" fill="#123a55"/>
  <path d="M320 456l75-60 65 41 55-35 143 69H320Z" fill="#7acff0"/>
  <text x="320" y="515" class="section" fill="#b9ecff">Cycling Yucatán</text>
  <rect x="320" y="538" width="290" height="13" rx="6" fill="#527b90"/><rect x="320" y="566" width="235" height="13" rx="6" fill="#527b90"/>
  <rect x="320" y="603" width="128" height="36" rx="18" fill="#6ecbed"/><text x="349" y="628" class="small white" font-weight="700">Edit title</text>
  <rect x="102" y="695" width="166" height="42" rx="21" fill="#6ecbed"/><text x="133" y="723" class="tag white">AUTHOR</text>
  <text x="290" y="723" class="body">Internal · authenticated · editable</text>

