<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A visitor may never reach Publish</title>
  <desc id="desc">A decision flow shows a request checking CDN cache, then Dispatcher cache, then Publish only on cache misses.</desc>
  <defs>
    <radialGradient id="blue-glow" cx="52%" cy="76%" r="72%"><stop offset="0" stop-color="#e9f9ff" stop-opacity=".9"/><stop offset=".3" stop-color="#7bc9ea" stop-opacity=".34"/><stop offset=".68" stop-color="#174e70" stop-opacity=".12"/><stop offset="1" stop-color="#031d32" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#9fe7ff" opacity=".22"/></pattern>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#9fe7ff"/></marker>
    <marker id="gray-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#8eb4c9"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#f7fbff}.eyebrow{font-size:20px;font-weight:800;letter-spacing:3px;fill:#9fe7ff}.title{font-size:56px;font-weight:760;letter-spacing:-2px}.subtitle{font-size:23px;fill:#b8c8d4}.node{font-size:24px;font-weight:760}.node-note{font-size:17px;fill:#b8c8d4}.label{font-size:17px;font-weight:800}.body{font-size:21px}.source{font-size:15px;fill:#6f91a5}.request{fill:none;stroke:#8eb4c9;stroke-width:5;marker-end:url(#gray-arrow)}.return{fill:none;stroke:#9fe7ff;stroke-width:5;marker-end:url(#green-arrow)}
    rect[fill="#fff"],path[fill="#fff"],circle[fill="#fff"]{fill:#08283f}</style>
  </defs>
  <rect width="1600" height="900" fill="#031d32"/><rect width="14" height="900" fill="#9fe7ff"/>
  <rect width="1600" height="900" fill="url(#blue-glow)"/><rect width="1600" height="900" fill="url(#dots)" opacity=".18"/><g opacity=".12" fill="none" stroke="#9fe7ff"><circle cx="1570" cy="920" r="650" stroke-width="180"/><circle cx="1570" cy="920" r="390" stroke-width="110"/></g>
  <text x="72" y="70" class="eyebrow">04 · VISITOR REQUEST</text>
  <text x="72" y="145" class="title">A visitor may never reach Publish.</text>
  <text x="72" y="198" class="subtitle">Each cache hit ends the trip early; only consecutive misses require a fresh render.</text>

  <rect x="72" y="320" width="230" height="120" rx="20" fill="#fff" stroke="#8eb4c9" stroke-width="3"/>
  <circle cx="132" cy="380" r="30" fill="#0c3048" stroke="#8eb4c9" stroke-width="2"/>
  <circle cx="132" cy="380" r="12" fill="none" stroke="#8eb4c9" stroke-width="3"/><path d="M112 380h40M132 360c8 8 8 32 0 40M132 360c-8 8-8 32 0 40" fill="none" stroke="#8eb4c9" stroke-width="2"/>
  <text x="180" y="374" class="node">Browser</text><text x="180" y="405" class="node-note">requests URL</text>

  <path d="M302 380H412" class="request"/><text x="326" y="355" class="label" fill="#8eb4c9">REQUEST</text>
  <path d="M520 282 628 380 520 478 412 380Z" fill="#fff" stroke="#9fe7ff" stroke-width="3"/>
  <text x="471" y="369" class="node" fill="#b9ecff">CDN</text><text x="452" y="401" class="node-note">valid cache?</text>

  <path d="M628 380H758" class="request"/><text x="664" y="355" class="label" fill="#8eb4c9">MISS</text>
  <path d="M866 282 974 380 866 478 758 380Z" fill="#fff" stroke="#9fe7ff" stroke-width="3"/>
  <text x="800" y="369" class="node" fill="#b9ecff">Dispatcher</text><text x="813" y="401" class="node-note">valid cache?</text>

  <path d="M974 380H1105" class="request"/><text x="1010" y="355" class="label" fill="#8eb4c9">MISS</text>
  <rect x="1128" y="320" width="250" height="120" rx="20" fill="#092a42" stroke="#74d2f5" stroke-width="3"/>
  <text x="1201" y="374" class="node" fill="#b9ecff">Publish</text><text x="1181" y="405" class="node-note">renders fresh HTML</text>

  <path d="M520 478V592H372" class="return"/><text x="423" y="527" class="label" fill="#9fe7ff">HIT</text>
  <rect x="72" y="548" width="300" height="88" rx="18" fill="#0a3048" stroke="#9fe7ff" stroke-width="3"/>
  <text x="112" y="584" class="node" fill="#b9ecff">Response</text><text x="112" y="614" class="node-note">CDN returns cached HTML</text>

  <path d="M866 478V678H372" class="return"/><text x="769" y="525" class="label" fill="#9fe7ff">HIT</text>
  <rect x="72" y="650" width="300" height="88" rx="18" fill="#0a3048" stroke="#9fe7ff" stroke-width="3"/>
  <text x="112" y="686" class="node" fill="#b9ecff">Response</text><text x="99" y="716" class="node-note">Dispatcher returns cached HTML</text>

  <path d="M1378 380H1450V796H372" class="return"/>
  <rect x="72" y="752" width="300" height="88" rx="18" fill="#0a3048" stroke="#9fe7ff" stroke-width="3"/>
  <text x="112" y="788" class="node" fill="#b9ecff">Response</text><text x="99" y="818" class="node-note">fresh HTML returns and caches</text>

  <rect x="1070" y="522" width="380" height="146" rx="18" fill="#0a3048"/>
  <text x="1102" y="562" class="body" font-weight="700" fill="#9fe7ff">Diagnostic meaning</text>
  <text x="1102" y="601" class="body">Publish can be correct while</text>
  <text x="1102" y="632" class="body">a visitor sees cached HTML.</text>
  <text x="72" y="875" class="source">Source: Adobe · Content Delivery Flow (Browser → CDN → Dispatcher → Publish)</text>
</svg>
