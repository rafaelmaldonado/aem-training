<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Choose the flow before the tool</title>
  <desc id="desc">A diagnostic table maps three symptoms to content publication, code deployment or delivery caching and names the cheapest first check.</desc>
  <defs>
    <radialGradient id="blue-glow" cx="52%" cy="76%" r="72%"><stop offset="0" stop-color="#e9f9ff" stop-opacity=".9"/><stop offset=".3" stop-color="#7bc9ea" stop-opacity=".34"/><stop offset=".68" stop-color="#174e70" stop-opacity=".12"/><stop offset="1" stop-color="#031d32" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#9fe7ff" opacity=".22"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#8eb4c9"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#f7fbff}.eyebrow{font-size:20px;font-weight:800;letter-spacing:3px;fill:#9fe7ff}.title{font-size:56px;font-weight:760;letter-spacing:-2px}.subtitle{font-size:23px;fill:#b8c8d4}.head{font-size:18px;font-weight:800;letter-spacing:1px;fill:#b8c8d4}.symptom{font-size:23px;font-weight:700}.flow{font-size:21px;font-weight:760}.check{font-size:20px}.rule{font-size:26px;font-weight:760}.white{fill:#fff}.small{font-size:17px;fill:#b8c8d4}.source{font-size:15px;fill:#6f91a5}.arrow{fill:none;stroke:#8eb4c9;stroke-width:5;marker-end:url(#arrow)}
    rect[fill="#fff"],path[fill="#fff"],circle[fill="#fff"]{fill:#08283f}</style>
  </defs>
  <rect width="1600" height="900" fill="#031d32"/><rect width="14" height="900" fill="#9fe7ff"/>
  <rect width="1600" height="900" fill="url(#blue-glow)"/><rect width="1600" height="900" fill="url(#dots)" opacity=".18"/><g opacity=".12" fill="none" stroke="#9fe7ff"><circle cx="1570" cy="920" r="650" stroke-width="180"/><circle cx="1570" cy="920" r="390" stroke-width="110"/></g>
  <text x="72" y="70" class="eyebrow">06 · PUT THE MODEL TO WORK</text>
  <text x="72" y="145" class="title">Choose the flow before the tool.</text>
  <text x="72" y="198" class="subtitle">Start with the cheapest observation that could prove your first hypothesis wrong.</text>

  <rect x="72" y="254" width="1456" height="486" rx="20" fill="#fff" stroke="#2f6f91" stroke-width="2"/>
  <rect x="72" y="254" width="1456" height="68" rx="20" fill="#151c1b"/>
  <text x="108" y="296" class="head">SYMPTOM</text><text x="678" y="296" class="head">AFFECTED FLOW</text><text x="1030" y="296" class="head">CHEAPEST FIRST CHECK</text>

  <rect x="92" y="344" width="1416" height="104" rx="14" fill="#0a3048"/>
  <text x="120" y="385" class="symptom">New title appears in Author,</text><text x="120" y="416" class="symptom">but visitors see the old title.</text>
  <rect x="674" y="367" width="262" height="56" rx="28" fill="#9fe7ff"/><text x="716" y="402" class="flow white">CONTENT</text>
  <text x="1030" y="386" class="check">Confirm publication status, then</text><text x="1030" y="416" class="check">compare a cache-bypassed response.</text>

  <rect x="92" y="470" width="1416" height="104" rx="14" fill="#092a42"/>
  <text x="120" y="511" class="symptom">HTL changed in Git, but the</text><text x="120" y="542" class="symptom">rendered markup is unchanged.</text>
  <rect x="674" y="493" width="262" height="56" rx="28" fill="#74d2f5"/><text x="739" y="528" class="flow white">CODE</text>
  <text x="1030" y="512" class="check">Verify the commit reached the built</text><text x="1030" y="542" class="check">artifact and deployed environment.</text>

  <rect x="92" y="596" width="1416" height="104" rx="14" fill="#0a3048"/>
  <text x="120" y="637" class="symptom">Publish returns the new page,</text><text x="120" y="668" class="symptom">but one visitor still sees stale HTML.</text>
  <rect x="674" y="619" width="262" height="56" rx="28" fill="#9fe7ff"/><text x="705" y="654" class="flow white">DELIVERY</text>
  <text x="1030" y="638" class="check">Inspect response headers and compare</text><text x="1030" y="668" class="check">browser, CDN and Dispatcher state.</text>

  <rect x="300" y="775" width="1000" height="64" rx="32" fill="#08283f" stroke="#9fe7ff" stroke-width="2"/>
  <text x="407" y="816" class="rule white">Identify flow → find last correct layer → test next boundary</text>
  <text x="72" y="875" class="source">Sources: Adobe · AEM architecture and Content Delivery Flow</text>
</svg>
