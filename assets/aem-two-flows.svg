<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Content, code and request flows in AEM</title>
  <desc id="desc">Content moves from Author to Publish, code moves from Git through a deployment pipeline to the AEM runtime, and a browser request passes through CDN and Dispatcher before Publish renders the response.</desc>
  <defs>
    <marker id="red-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#b42318"/></marker>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#15803d"/></marker>
    <style>
      .label{font:700 25px system-ui,sans-serif}.small{font:19px system-ui,sans-serif}.box{rx:16;stroke-width:3}.arrow{fill:none;stroke-width:7}
    </style>
  </defs>
  <rect width="1400" height="760" rx="36" fill="#f7f7f8"/>
  <text x="52" y="64" class="label" fill="#b42318">CONTENT FLOW</text>
  <rect x="52" y="94" width="220" height="92" class="box" fill="#fff7ed" stroke="#c2410c"/>
  <text x="109" y="148" class="label" fill="#7c2d12">Author</text>
  <path d="M282 140H398" class="arrow" stroke="#b42318" marker-end="url(#red-arrow)"/>
  <text x="304" y="119" class="small" fill="#7c2d12">publish</text>
  <rect x="420" y="94" width="250" height="92" class="box" fill="#fef2f2" stroke="#b42318"/>
  <text x="461" y="134" class="label" fill="#7f1d1d">Replication</text>
  <text x="481" y="163" class="small" fill="#7f1d1d">cloud queues</text>
  <path d="M680 140H796" class="arrow" stroke="#b42318" marker-end="url(#red-arrow)"/>
  <rect x="818" y="94" width="240" height="92" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="884" y="148" class="label" fill="#1e3a8a">Publish</text>
  <text x="52" y="296" class="label" fill="#2563eb">CODE FLOW</text>
  <rect x="52" y="326" width="220" height="92" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="134" y="380" class="label" fill="#1e3a8a">Git</text>
  <path d="M282 372H398" class="arrow" stroke="#2563eb" marker-end="url(#blue-arrow)"/>
  <rect x="420" y="326" width="250" height="92" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="449" y="366" class="label" fill="#1e3a8a">Build + tests</text>
  <text x="465" y="395" class="small" fill="#1e3a8a">Cloud Manager</text>
  <path d="M680 372H796" class="arrow" stroke="#2563eb" marker-end="url(#blue-arrow)"/>
  <rect x="818" y="326" width="240" height="92" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="862" y="366" class="label" fill="#1e3a8a">AEM code</text>
  <text x="858" y="395" class="small" fill="#1e3a8a">Author + Publish</text>
  <path d="M938 316V207" class="arrow" stroke="#2563eb" marker-end="url(#blue-arrow)"/>
  <rect x="1110" y="94" width="238" height="324" rx="22" fill="#fff" stroke="#d9dde3" stroke-width="3"/>
  <text x="1154" y="139" class="label" fill="#202124">Runtime</text>
  <text x="1142" y="190" class="small" fill="#5f6368">deployed component</text>
  <text x="1187" y="220" class="label" fill="#2563eb">+</text>
  <text x="1142" y="264" class="small" fill="#5f6368">published content</text>
  <path d="M1144 292H1316" stroke="#d9dde3" stroke-width="3"/>
  <text x="1166" y="340" class="label" fill="#202124">HTML</text>
  <text x="1147" y="377" class="small" fill="#5f6368">rendered response</text>
  <path d="M1068 140H1100" class="arrow" stroke="#b42318" marker-end="url(#red-arrow)"/>
  <path d="M1068 372H1100" class="arrow" stroke="#2563eb" marker-end="url(#blue-arrow)"/>
  <text x="52" y="526" class="label" fill="#15803d">VISITOR REQUEST</text>
  <rect x="52" y="558" width="196" height="88" class="box" fill="#f0fdf4" stroke="#15803d"/>
  <text x="96" y="610" class="label" fill="#14532d">Browser</text>
  <path d="M258 602H348" class="arrow" stroke="#15803d" marker-end="url(#green-arrow)"/>
  <rect x="370" y="558" width="196" height="88" class="box" fill="#f0fdf4" stroke="#15803d"/>
  <text x="437" y="610" class="label" fill="#14532d">CDN</text>
  <path d="M576 602H666" class="arrow" stroke="#15803d" marker-end="url(#green-arrow)"/>
  <rect x="688" y="558" width="214" height="88" class="box" fill="#f0fdf4" stroke="#15803d"/>
  <text x="731" y="610" class="label" fill="#14532d">Dispatcher</text>
  <path d="M912 602H1002" class="arrow" stroke="#15803d" marker-end="url(#green-arrow)"/>
  <rect x="1024" y="558" width="196" height="88" class="box" fill="#f0fdf4" stroke="#15803d"/>
  <text x="1077" y="610" class="label" fill="#14532d">Publish</text>
  <path d="M1220 602H1286V428" class="arrow" stroke="#15803d" marker-end="url(#green-arrow)"/>
  <text x="370" y="691" class="small" fill="#14532d">A cache hit can return the response before Publish runs.</text>
</svg>
